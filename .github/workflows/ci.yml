# ============================================================
#  CI · GitHub Actions
# ============================================================
#  Se ejecuta automáticamente en cada push y en cada Pull Request.
#  Corre dos "jobs" en paralelo: uno para el backend y otro para
#  el frontend. Si alguno falla (lint/test/build), el commit queda
#  marcado con ✗ en GitHub.
# ============================================================

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10   # si un runner se cuelga, que falle rápido y no en 6h
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci          # instala EXACTO lo del package-lock (reproducible)
      - run: npm run lint     # revisa estilo/errores con ESLint
      - run: npm test         # corre los tests (node --test)

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10   # tope de seguridad ante runners trabados
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build    # que el build compile es en sí una verificación
